<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capi Aventura">
<title>Capi Jogos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#14213D;--panel:#1D2D50;--line:#31456F;--fg:#FFFFFF;--mut:#C9D4EA;--y:#FFD23F;--g:#3BCB6B;--r:#FF5D5D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.px{font-family:"Press Start 2P",monospace}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;max-width:980px;margin:0 auto}
.logo{font-size:16px;color:var(--y);line-height:1.4}
.logo span{color:var(--g)}
.hud{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 14px;font-size:10px}
.hud b{color:var(--y);font-weight:400}
main{max-width:980px;margin:0 auto;padding:0 12px 20px;display:flex;flex-direction:column;gap:12px}
.frame{position:relative;border:4px solid var(--line);border-radius:10px;overflow:hidden;background:#6EC6FF;line-height:0}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(20,33,61,.82);text-align:center;padding:16px;line-height:1.6}
.over h1{margin:0;font-size:clamp(16px,4.5vw,28px);color:var(--y);font-weight:400}
.over p{margin:0;font-size:clamp(13px,3vw,17px);color:var(--mut);max-width:30em}
.play{font-family:"Press Start 2P",monospace;font-size:13px;min-height:52px;padding:0 24px;border:0;border-radius:8px;background:var(--g);color:#06210F;cursor:pointer;box-shadow:0 5px 0 #1E8A43}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 #1E8A43}
.hidden{display:none}
.over{overflow:auto}
.stars{font-size:clamp(20px,6vw,34px);letter-spacing:6px;color:#55648C;line-height:1}
.stars b{color:var(--y);font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.play.alt{background:var(--panel);color:var(--fg);box-shadow:0 5px 0 #0C1630;border:2px solid var(--line)}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(100%,460px)}
.lv button{font-family:"Press Start 2P",monospace;min-height:58px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;line-height:1}
.lv button small{font-size:9px;letter-spacing:2px;color:#55648C}
.lv button small b{color:var(--y);font-weight:400}
.lv button:disabled{opacity:.45;cursor:default}
.best{font-size:13px;color:var(--mut)}
.over>*{position:relative;z-index:1}
.fl{position:absolute!important;inset:0;z-index:0!important;overflow:hidden;pointer-events:none}
.fl i{position:absolute;bottom:-12%;display:block;animation:rise 6s linear infinite;opacity:.9}
.fl i svg,.in svg{display:block;width:100%;height:auto}
.fl i.cn{animation-name:rise2}
@keyframes rise{0%{bottom:-12%;transform:translateX(0)}50%{transform:translateX(14px)}100%{bottom:108%;transform:translateX(-6px)}}
@keyframes rise2{0%{bottom:-12%;transform:translateX(0) scaleX(1)}25%{transform:translateX(-8px) scaleX(.3)}50%{transform:translateX(6px) scaleX(1)}75%{transform:translateX(-4px) scaleX(.3)}100%{bottom:108%;transform:translateX(0) scaleX(1)}}
.wel{line-height:1.5!important}
.wel span{color:var(--g);font-size:1.35em}
.pvs{display:flex;gap:6px;justify-content:center;background:#6EC6FF;border:3px solid var(--line);border-radius:12px;padding:4px 10px}
.pvs canvas{width:44px;height:44px;image-rendering:pixelated;image-rendering:crisp-edges}
.ded{color:#FFFFFF!important;font-weight:800}
.ded b{color:#FF8FA6}
.in{display:inline-block;width:16px;vertical-align:-2px;animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.fl{display:none}}
.credit{font-size:13px;color:var(--mut);text-align:center;margin:0;line-height:1.4}
.credit b{color:var(--y);font-weight:800}
.gm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,560px)}
.gm button{display:flex;align-items:center;gap:10px;text-align:left;min-height:72px;padding:8px 10px;border-radius:12px;border:3px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-family:Nunito,sans-serif;line-height:1.2}
.gm button:hover{border-color:var(--y)}
.gm canvas{flex:0 0 48px;width:48px;height:48px;border-radius:8px;background:#6EC6FF;image-rendering:pixelated;image-rendering:crisp-edges}
.gm span{display:flex;flex-direction:column;gap:2px;min-width:0}
.gm strong{font-size:15px;font-weight:800}
.gm small{font-size:12px;color:var(--mut)}
body[data-mode="bunny"] .pad div .key{opacity:.35}
.ch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ch button{width:84px;min-height:84px;padding:6px 4px;border-radius:10px;border:3px solid var(--line);background:#6EC6FF;color:#14213D;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 12px Nunito,sans-serif;line-height:1.1}
.ch button canvas{width:52px;height:52px;image-rendering:pixelated;image-rendering:crisp-edges}
.ch button.sel{border-color:var(--y);background:#FFF2B0;box-shadow:0 0 0 2px var(--y)}
.over{justify-content:flex-start}.over>:first-child{margin-top:auto}.over>:last-child{margin-bottom:auto}
.pad{display:flex;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.pad div{display:flex;gap:10px}
.key{width:72px;height:72px;border-radius:16px;border:3px solid var(--line);background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none}
.key.jump{width:96px;border-radius:50px;background:var(--y);border-color:#C79A12;color:#3A2B00;font-size:11px}
.key.on{filter:brightness(1.35)}
.tip{font-size:15px;color:var(--mut);text-align:center;margin:0}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
.touch .pad{display:flex}
@media (max-width:520px){.logo{font-size:12px}.hud{font-size:8px;gap:8px}}

html,body{overscroll-behavior:none;touch-action:manipulation}
body.menu .pad{visibility:hidden}
body.menu .hud{visibility:hidden}
.turn{display:none;font-size:14px;color:var(--mut);text-align:center;margin:0}
@media (pointer:coarse),(max-width:900px){
.tip{display:none}
.key{width:84px;height:84px}
.key.jump{width:116px;height:92px;font-size:12px}
}
@media (pointer:coarse) and (orientation:portrait),(max-width:700px) and (orientation:portrait){
body{min-height:100dvh;display:flex;flex-direction:column}
main{flex-grow:1;width:100%}
.pad{flex-grow:1;align-items:center;padding:8px 6px 14px}
.key{width:96px;height:96px}
.key.jump{width:132px;height:108px;font-size:13px}
.over{position:fixed;inset:0;z-index:10;background:var(--bg);gap:20px;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px))}
.over h1{font-size:clamp(20px,6.4vw,30px)}
.over p{font-size:17px}
.pvs canvas{width:52px;height:52px}
.play{min-height:60px;font-size:15px;padding:0 30px}
.gm{grid-template-columns:1fr}
.gm button{min-height:84px}
.gm canvas{flex-basis:56px;width:56px;height:56px}
.gm strong{font-size:17px}
.gm small{font-size:14px}
.lv button{min-height:72px;font-size:15px}
.ch button{width:92px;min-height:96px;font-size:13px}
.turn{display:block}
}
@media (pointer:coarse) and (orientation:landscape),(max-height:520px) and (orientation:landscape){
:root{padding:0}
body{height:100dvh;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:3;max-width:none;padding:calc(6px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));pointer-events:none;justify-content:center}
.logo{display:none}
.hud{justify-content:center;gap:4px 16px;font-size:9px;text-shadow:1px 1px 0 #14213D,-1px 1px 0 #14213D,1px -1px 0 #14213D,-1px -1px 0 #14213D}
main{max-width:none;padding:0;height:100dvh;gap:0}
.frame{border:0;border-radius:0;height:100dvh;display:flex;justify-content:center;background:#0B1326}
canvas{height:100%;width:auto;max-width:100%;object-fit:contain}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 calc(14px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));pointer-events:none}
.pad .key{pointer-events:auto;opacity:.55;width:76px;height:76px}
.pad .key.jump{width:104px;height:84px}
.pad .key.on{opacity:.9}
.over{gap:10px;padding:10px}
.over h1{font-size:16px}
.over p{font-size:13px}
.ch button{width:70px;min-height:66px;font-size:11px}
.ch button canvas{width:38px;height:38px}
.lv{grid-template-columns:repeat(6,minmax(0,1fr));width:min(100%,560px)}
.credit.foot{display:none}
.pvs canvas{width:30px;height:30px}
.gm button{min-height:58px;padding:5px 8px}
.gm canvas{flex-basis:40px;width:40px;height:40px}
.lv button{min-height:50px}
.play{min-height:46px}
}
</style>
</head>
<body>
<header>
<div class="logo px">CAPI <span>JOGOS</span></div>
<div class="hud px" id="hud"><span>FASE <b id="hf">1</b></span><span>MOEDAS <b id="hc">0</b></span><span>VIDAS <b id="hl">3</b></span><span>PONTOS <b id="ht">0</b></span></div>
</header>
<main>
<div class="frame">
<canvas id="c" width="384" height="208" aria-label="Jogo de plataforma Capi Aventura"></canvas>
<div class="over" id="over"></div>
</div>
<div class="pad" aria-label="Controles">
<div>
<button class="key" id="kl" aria-label="Esquerda"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="key" id="kr" aria-label="Direita"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<button class="key jump px" id="kj" aria-label="Pular">PULAR</button>
</div>
<p class="credit foot">Desenvolvido por <b>@henriqueepro</b></p>
<p class="turn">Vire o celular de lado para jogar em tela cheia.</p>
<p class="tip">No computador: setas ou A/D para mover, espaço para pular, R para reiniciar.</p>
</main>
<script>
(() => {
const T = 16, H = 13, VW = 384, VH = 208, NL = 6;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const $ = (id) => document.getElementById(id);
const THEMES = [
  { n: 'Campo Verde', sky: '#6EC6FF', hill: '#4FB37A', top: '#3BCB6B', edge: '#1E8A43', cloud: '#FFFFFF' },
  { n: 'Fim de Tarde', sky: '#FFB37A', hill: '#C96F5A', top: '#7BC96B', edge: '#3E8A3A', cloud: '#FFE3C4' },
  { n: 'Lagoa Roxa', sky: '#7A6FD6', hill: '#4B4AA0', top: '#49B88A', edge: '#23785A', cloud: '#B9B3F2' },
  { n: 'Noite Clara', sky: '#1B2452', hill: '#2B3B7A', top: '#3AA37A', edge: '#1D6B4E', cloud: '#4A5AA8' },
  { n: 'Serra Gelada', sky: '#BFE6FF', hill: '#8FB9D9', top: '#F4FAFF', edge: '#9CC3DE', cloud: '#FFFFFF' },
  { n: 'Vale do Fogo', sky: '#3A1420', hill: '#7A2A2A', top: '#E0722B', edge: '#8A3A12', cloud: '#6B2A33' }
];
const DK = '#1B1033';
const CHARS = [
  { id: 'capivara', n: 'Capivara', foot: '#6E3F1C', px: [[0, 4, 12, 8, '#A86B3A'], [5, 1, 8, 7, '#B97A45'], [6, 0, 2, 2, '#6E3F1C'], [9, 3, 2, 2, DK], [11, 5, 2, 2, '#6E3F1C']] },
  { id: 'macaco', n: 'Macaquinho', foot: '#6B4420', px: [[-1, 2, 2, 2, '#6B4420'], [0, 3, 2, 7, '#6B4420'], [2, 6, 8, 6, '#8B5A2B'], [3, 0, 9, 7, '#8B5A2B'], [2, 2, 2, 3, '#E8C39E'], [6, 2, 6, 5, '#E8C39E'], [8, 3, 2, 2, DK], [8, 6, 3, 1, '#6B4420']] },
  { id: 'gato', n: 'Gatinho', foot: '#C96A12', px: [[-1, 2, 2, 8, '#F08A24'], [1, 6, 10, 6, '#F08A24'], [4, 9, 5, 3, '#FFFFFF'], [4, 2, 9, 6, '#F5A04A'], [4, 0, 2, 2, '#F08A24'], [10, 0, 2, 2, '#F08A24'], [9, 4, 2, 2, DK], [12, 6, 1, 1, '#FF7AA8']] },
  { id: 'coelho', n: 'Coelho', foot: '#9AA5BD', px: [[-1, 8, 2, 2, '#FFFFFF'], [1, 6, 10, 6, '#E9EDF5'], [4, 3, 9, 6, '#FFFFFF'], [5, -3, 2, 6, '#FFFFFF'], [9, -3, 2, 6, '#FFFFFF'], [5, -2, 1, 4, '#FFB3CC'], [9, -2, 1, 4, '#FFB3CC'], [9, 5, 2, 2, DK], [12, 7, 1, 1, '#FF7AA8']] },
  { id: 'vitoria', n: 'Vitória', foot: '#4A2A12', px: [[2, 0, 8, 10, '#6B3F1D'], [2, 7, 8, 5, '#E8478B'], [5, 2, 6, 5, '#F2C9A0'], [4, 0, 7, 2, '#6B3F1D'], [8, 4, 2, 2, DK], [9, 6, 2, 1, '#C9705A'], [5, 8, 2, 3, '#F2C9A0']] }
];
function hero(ctx, ch, x, y, d, run, on, power) {
  const r = (px, py, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(d > 0 ? x + px : x + 12 - px - w, y + py, w, h); };
  ch.px.forEach((q) => r(q[0], q[1], q[2], q[3], q[4]));
  if (on) { r(1 + run * 2, 12, 3, 2, ch.foot); r(8 - run * 2, 12, 3, 2, ch.foot); } else { r(0, 11, 3, 2, ch.foot); r(9, 11, 3, 2, ch.foot); }
  if (power) { r(-3, 5, 3, 1, '#FFD23F'); r(-2, 4, 1, 3, '#FFD23F'); r(12, 9, 3, 1, '#FFD23F'); r(13, 8, 1, 3, '#FFD23F'); }
}
let save = { unlocked: 1, char: 0, hi: {}, stars: [0, 0, 0, 0, 0, 0], best: [0, 0, 0, 0, 0, 0] };
try { const raw = localStorage.getItem('capi_v1'); if (raw) save = Object.assign(save, JSON.parse(raw)); if (!save.hi) save.hi = {}; } catch (e) { /* sem armazenamento */ }
const persist = () => { try { localStorage.setItem('capi_v1', JSON.stringify(save)); } catch (e) { /* ok */ } };

let W = 200, map, coins, foes, fx, items, p, cam, state = 'menu', L = 0, th = THEMES[0];
let coinsGot = 0, coinsTotal = 0, lives = 3, frames = 0, score = 0, deaths = 0, combo = 0, flagX = 190, cpX = 0, cpOn = false;

function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function gen(lv) {
  const R = rng(1337 + lv * 97), d = lv;
  W = 150 + lv * 25;
  map = Array.from({ length: H }, () => Array(W).fill(' '));
  for (let c = 0; c < W; c++) { map[11][c] = 'G'; map[12][c] = 'D'; }
  coins = []; foes = []; fx = []; items = [];
  const coin = (c, r) => coins.push({ x: c * T + 4, y: r * T + 4, got: false });
  const foe = (c, fast) => foes.push({ x: c * T, y: 11 * T - 12, w: 14, h: 12, vx: -(0.5 + (fast ? 0.35 : 0) + d * 0.04), vy: 0, dead: 0 });
  const end = W - 36;
  let c = 10, powerPlaced = false, last = '';
  const types = ['flat', 'gap', 'stump', 'plat', 'plat'];
  if (d >= 1) types.push('spike', 'gap');
  if (d >= 2) types.push('spring', 'fly');
  if (d >= 3) types.push('spike', 'fly', 'gap');
  while (c < end) {
    let t = types[Math.floor(R() * types.length)];
    if (t === last && t !== 'flat') t = 'flat';
    last = t;
    if (t === 'flat') {
      const n = 4 + Math.floor(R() * 4);
      if (R() < 0.5 + d * 0.08) foe(c + n - 2, R() < d * 0.15);
      if (R() < 0.5) for (let i = 1; i < n - 1; i++) coin(c + i, 10);
      c += n;
    } else if (t === 'gap') {
      const w = 2 + Math.floor(R() * Math.min(3, 1 + d * 0.5));
      for (let i = 0; i < w; i++) { map[11][c + i] = ' '; map[12][c + i] = ' '; coin(c + i, 7); }
      c += w + 3;
    } else if (t === 'stump') {
      const h = 2 + Math.floor(R() * 2);
      for (let i = 0; i < h; i++) { map[10 - i][c] = 'S'; map[10 - i][c + 1] = 'S'; }
      coin(c, 9 - h); coin(c + 1, 9 - h);
      c += 2 + 3;
    } else if (t === 'plat') {
      const n = 3 + Math.floor(R() * 3);
      for (let i = 0; i < n; i++) { map[8][c + 1 + i] = 'B'; coin(c + 1 + i, 6); }
      if (R() < 0.7) { const qc = c + 1 + Math.floor(n / 2); map[8][qc] = '?'; if (!powerPlaced && c > 25) { map[8][qc] = 'F'; powerPlaced = true; } }
      if (R() < 0.5) { for (let i = 0; i < 3; i++) { map[5][c + n + 2 + i] = 'B'; coin(c + n + 2 + i, 3); } }
      if (R() < 0.4 + d * 0.08) foe(c + 2, false);
      c += n + 5;
    } else if (t === 'spike') {
      const w = 1 + Math.floor(R() * 2);
      for (let i = 0; i < w; i++) { map[10][c + i] = '^'; coin(c + i, 7); }
      c += w + 3;
    } else if (t === 'spring') {
      map[10][c + 1] = 'P';
      for (let r = 6; r <= 10; r++) { map[r][c + 5] = 'B'; map[r][c + 6] = 'B'; }
      for (let i = 2; i <= 6; i++) coin(c + i, 3);
      c += 7 + 3;
    } else if (t === 'fly') {
      foes.push({ x: (c + 3) * T, y: 7 * T, w: 14, h: 12, vx: -0.6, vy: 0, dead: 0, fly: true, bx: (c + 3) * T, by: 7 * T, ph: R() * 6 });
      for (let i = 0; i < 6; i++) coin(c + i, 5);
      c += 6;
    }
  }
  for (let i = 0; i < 6; i++) for (let j = 0; j <= i; j++) map[10 - j][W - 20 + i] = 'B';
  flagX = W - 8;
  let m = Math.floor(W / 2);
  while (m < W - 30 && !(map[11][m] === 'G' && map[10][m] === ' ' && map[11][m + 1] === 'G' && map[10][m + 1] === ' ')) m++;
  cpX = m; cpOn = false;
  coins = coins.filter((k) => { const cc = Math.floor(k.x / T), rr = Math.floor(k.y / T); return map[rr][cc] === ' '; });
  coinsTotal = coins.length + map.flat().filter((x) => x === '?').length;
}
function spawn(x) { p = { x: x || 3 * T, y: 9 * T, w: 12, h: 14, vx: 0, vy: 0, on: false, dir: 1, inv: 0, power: p ? p.power : false, dj: false }; }
const tile = (c, r) => (c < 0 || c >= W) ? 'B' : (r < 0 || r >= H) ? ' ' : map[r][c];
const solid = (c, r) => { const t = tile(c, r); return t !== ' ' && t !== '^' && t !== 'P'; };
function hits(e) {
  const c0 = Math.floor(e.x / T), c1 = Math.floor((e.x + e.w - 0.01) / T), r0 = Math.floor(e.y / T), r1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solid(c, r)) return true;
  return false;
}
function touches(e, ch) {
  const c0 = Math.floor((e.x + 2) / T), c1 = Math.floor((e.x + e.w - 2) / T), r = Math.floor((e.y + e.h - 3) / T);
  return tile(c0, r) === ch || tile(c1, r) === ch;
}
function move(e, isP) {
